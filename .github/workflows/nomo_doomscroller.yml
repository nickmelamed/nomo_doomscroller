name: NOMO Doomscroller
on:
  schedule:
    # Runs twice a week — the gather window (main.py's _effective_gather_config)
    # dynamically covers the gap since the last successful run, so it isn't tied
    # to any particular two days. To change which days it runs, edit only the
    # day-of-week field below (cron numbering: 0=Sun..6=Sat) — no code changes
    # needed elsewhere.
    - cron: "0 13 * * 1,4"   # 13:00 UTC ≈ 6:00am PT, Monday and Thursday
  workflow_dispatch: {}        # manual test runs
permissions:
  contents: write   # needed to commit state/ back to the repo after a successful run
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - run: python main.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DATA_SOURCE: ${{ vars.DATA_SOURCE }}   # repo Variable, not a secret — "sheets" or "notion"
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEETS_URL: ${{ secrets.SHEETS_URL }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_WATCHLIST_DB_ID: ${{ secrets.NOTION_WATCHLIST_DB_ID }}
          NOTION_CRITERIA_PAGE_ID: ${{ secrets.NOTION_CRITERIA_PAGE_ID }}
          NOTION_TOPICS_DB_ID: ${{ secrets.NOTION_TOPICS_DB_ID }}
          NOTION_PARTNERS_DB_ID: ${{ secrets.NOTION_PARTNERS_DB_ID }}
          NOTION_DB_URL: ${{ secrets.NOTION_DB_URL }}
      # Commit state/ (seen-story hashes, last-success timestamp, daily digest
      # archive) back to the repo — only after a successful run, so a failed
      # run never commits half-written state. Rebase-and-retry handles the
      # rare case of an overlapping manual dispatch racing the scheduled run.
      - if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- state/ && [ -z "$(git status --porcelain -- state/)" ]; then
            echo "no state changes to commit"
            exit 0
          fi
          git add state/
          git commit -m "Update pipeline state [skip ci]"
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "push rejected (attempt $attempt/3) — rebasing and retrying"
            git pull --rebase origin "${GITHUB_REF_NAME}"
          done
          echo "failed to push state after 3 attempts" >&2
          exit 1
